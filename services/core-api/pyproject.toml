[project]
name = "sentinel-core-api"
version = "0.1.0"
description = "System of record, tool endpoints, and the per-visitor SSE stream"
requires-python = ">=3.12"
dependencies = [
    "sentinel-contracts",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "prometheus-client>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinel_core_api"]

[tool.uv.sources]
sentinel-contracts = { workspace = true }
