[project]
name = "sentinel-agent"
version = "0.1.0"
description = "Pipecat voice pipeline, state machine, tools"
requires-python = ">=3.12"
dependencies = [
    "sentinel-contracts",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "prometheus-client>=0.21",
    "pipecat-ai[cartesia,cerebras,deepgram,silero,webrtc]>=1.8.1",
    "python-dotenv>=1.2.3",
    "anthropic>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinel_agent"]

[tool.uv.sources]
sentinel-contracts = { workspace = true }
