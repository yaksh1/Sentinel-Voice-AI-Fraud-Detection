<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentinel agent — echo check</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 34rem; margin: 4rem auto; padding: 0 1rem; }
  h1 { font-size: 1.1rem; margin-bottom: .25rem; }
  p.sub { margin-top: 0; opacity: .7; }
  button { font: inherit; padding: .5rem 1.1rem; border-radius: .4rem; cursor: pointer; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: .3rem 1rem; margin-top: 1.5rem; }
  dt { opacity: .6; }
  dd { margin: 0; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <h1>Sentinel agent — echo check</h1>
  <p class="sub">PLAN 1.1. Wear headphones: on speakers the echo feeds back on itself.</p>

  <button id="btn">Connect</button>

  <dl>
    <dt>Connection</dt><dd id="state">idle</dd>
    <dt>Peer id</dt><dd id="pcid">—</dd>
    <dt>Round trip</dt><dd id="rtt">—</dd>
  </dl>

  <audio id="remote" autoplay></audio>

<script>
const $ = id => document.getElementById(id);
let pc = null, mic = null, statsTimer = null;

// No trickle: gather candidates, then send one complete offer. The PATCH
// endpoint exists for the Pipecat JS client in 1.2; this page does not need it.
function iceGathered(pc) {
  if (pc.iceGatheringState === "complete") return Promise.resolve();
  return new Promise(resolve => {
    const done = () => { clearTimeout(t); pc.removeEventListener("icegatheringstatechange", check); resolve(); };
    const check = () => { if (pc.iceGatheringState === "complete") done(); };
    const t = setTimeout(done, 2000);  // host candidates alone are enough on localhost
    pc.addEventListener("icegatheringstatechange", check);
  });
}

async function connect() {
  mic = await navigator.mediaDevices.getUserMedia({ audio: true });
  pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });

  pc.ontrack = e => { $("remote").srcObject = e.streams[0]; };
  pc.onconnectionstatechange = () => {
    $("state").textContent = pc.connectionState;
    if (pc.connectionState === "failed" || pc.connectionState === "closed") disconnect();
  };
  mic.getTracks().forEach(t => pc.addTrack(t, mic));

  await pc.setLocalDescription(await pc.createOffer());
  await iceGathered(pc);

  const res = await fetch("/api/offer", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type }),
  });
  if (!res.ok) throw new Error(`offer rejected: ${res.status}`);

  const answer = await res.json();
  $("pcid").textContent = answer.pc_id;
  await pc.setRemoteDescription(answer);

  // currentRoundTripTime is the network half of the delay you hear; the rest
  // is pipeline buffering. Per-frame timing on the server is PLAN 1.3.
  statsTimer = setInterval(async () => {
    for (const s of await pc.getStats()) {
      const r = s[1];
      if (r.type === "candidate-pair" && r.nominated && r.currentRoundTripTime != null) {
        $("rtt").textContent = `${Math.round(r.currentRoundTripTime * 1000)} ms`;
      }
    }
  }, 1000);
}

function disconnect() {
  clearInterval(statsTimer); statsTimer = null;
  if (pc) { pc.close(); pc = null; }
  if (mic) { mic.getTracks().forEach(t => t.stop()); mic = null; }
  $("remote").srcObject = null;
  $("state").textContent = "idle";
  $("pcid").textContent = "—";
  $("rtt").textContent = "—";
  $("btn").textContent = "Connect";
}

$("btn").onclick = async () => {
  if (pc) return disconnect();
  $("btn").textContent = "Disconnect";
  $("state").textContent = "connecting";
  try { await connect(); } catch (e) { $("state").textContent = e.message; disconnect(); }
};
</script>
</body>
</html>
