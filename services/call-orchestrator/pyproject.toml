[project]
name = "sentinel-call-orchestrator"
version = "0.1.0"
description = "Dedupe, rate limit, capacity, ring timer"
requires-python = ">=3.12"
dependencies = [
    "sentinel-contracts",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "prometheus-client>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinel_call_orchestrator"]

[tool.uv.sources]
sentinel-contracts = { workspace = true }
