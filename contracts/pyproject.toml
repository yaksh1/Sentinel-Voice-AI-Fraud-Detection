[project]
name = "sentinel-contracts"
version = "0.1.0"
description = "Shared event contracts for the seven messages that cross service boundaries"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinel_contracts"]
